<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Joy Baumann</title>
<meta name="description" content="Get in touch about Joy Baumann's story — questions, memories, photographs, or documents you would like to share.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Primary">
      <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
      <a href="/#her-story">Her Story</a>
      <a href="/#chapter-two">Chapters</a>
      <a href="/#reviews">Reviews</a>
      <a href="/contact" class="is-active">Contact</a>
    </nav>
  </div>
</header>

<main>

  <!-- CONTACT -->
  <section class="section section-alt contact-page" id="contact">
    <div class="section-inner narrow">
      <p class="kicker reveal">Contact</p>
      <h1 class="section-title reveal" style="transition-delay: 90ms;">Contact</h1>
      <p class="section-intro reveal" style="transition-delay: 180ms;">
        Have a question, memory, photograph, document, or story you would like to share? Please use the form below to get in touch.
      </p>

      <form class="contact-form reveal" id="contactForm" style="transition-delay: 260ms;">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p class="form-note" id="formNote" role="status"></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-links" aria-label="Footer">
      <a href="/#her-story">Her Story</a>
      <a href="/#chapter-two">Chapters</a>
      <a href="/#reviews">Reviews</a>
      <a href="/contact" class="is-active">Contact</a>
    </nav>
    <p class="footer-copy">&copy; <span id="year"></span> Joy Baumann. All rights reserved.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
