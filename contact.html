<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Joy Baumann</title>
<meta name="description" content="Get in touch about Joy Baumann's story — questions, memories, photographs, or documents you would like to share.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="/" class="site-nav-link site-nav-link--left">&larr; Back to Joy&rsquo;s Story</a>

<main>

  <!-- CONTACT -->
  <section class="section section-alt contact-page" id="contact">
    <div class="section-inner narrow">
      <div class="story-connector story-connector--diamond story-connector--blue story-connector--major" aria-hidden="true" style="--conn-from: var(--cream); --conn-to: var(--cream);">
        <span class="story-connector-line"></span>
        <span class="story-connector-marker"></span>
        <span class="story-connector-line"></span>
      </div>
      <h1 class="section-title reveal">Contact</h1>
      <p class="section-intro reveal" style="transition-delay: 90ms;">
        Have a question, memory, photograph, document, or story you would like to share? Please use the form below to get in touch.
      </p>

      <form class="contact-form reveal" id="contactForm" style="transition-delay: 180ms;">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <p class="form-note" id="formNote" role="status"></p>
      </form>

      <div class="story-connector story-connector--dot" aria-hidden="true" style="--conn-from: var(--cream); --conn-to: var(--cream-alt); height: 44px;">
        <span class="story-connector-line"></span>
        <span class="story-connector-marker story-connector-marker--blue"></span>
        <span class="story-connector-line"></span>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-links" aria-label="Footer">
      <a href="/#her-story">Her Story</a>
      <a href="/#chapter-two">Chapters</a>
      <a href="/#reviews">Reviews</a>
      <a href="/contact" class="is-active">Contact</a>
    </nav>
    <p class="footer-copy">&copy; <span id="year"></span> Joy Baumann. All rights reserved.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
